[package]
name = "emufront-rust"
version = "0.7.0-alpha"
edition = "2021"

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "EmuFrontRust"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
# v1.05: the config's typed streaming parse (main.rs,
# "typed config parsing") and the snapshot format derive
# their (de)serialization from serde. MIT/Apache-2.0,
# credited in About alongside serde_json. sha1 0.10 was
# already a direct dependency (art keys) and now also
# carries the snapshot fingerprint.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Format trim (OLD-SYSTEMS study §2.5): every cover in
# either art source passes through ONE decode call,
# image::load_from_memory, and covers are PNG/JPEG in
# practice. The 0.25 defaults also compile ravif/AVIF,
# EXR, TIFF and QOI stacks nothing can ever display —
# dead pages in the exe on every cold start and scan.
# The list below keeps the formats a cover or a user's
# dropped-in art file can plausibly be. (Feature flags
# verified against the image 0.25.8 flag list; "std" is
# not a flag in 0.25 and must not be listed.)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
ureq = { version = "2", features = ["json"] }
sha1 = "0.10"
# Music feature (MUSIC-FEATURE-PREP.md): the --music-probe
# build gate passed Oct 23 2026; the detail-panel player
# (SPC/NSF/VGM/MIDI + lounge fallback) uses these now.
# game-music-emu with DEFAULT features on purpose: the crate's
# defaults are its tested set (all emulators + the nuked YM2612
# core the VGM build needs). Its build.rs compiles the bundled
# libgme C++ with the cc crate (needs g++ on PATH; run-vbuild.cmd
# provides WinLibs MinGW). Binding is MIT; libgme is LGPL-2.1+.
game-music-emu = "0.3"
# Pure-Rust SoundFont MIDI synth (no native deps).
rustysynth = "1.3"
# Playback only: cpal/WASAPI, no Symphonia decoders -- our engines
# render the samples, rodio is just the output path.
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# .vgz inflate; default backend is miniz_oxide (pure Rust), so
# libgme stays the tree's only native dependency.
flate2 = "1"
# Discord Rich Presence (v1.07, feature #3): local IPC to
# the Discord client over its named pipe — no tokens, no
# account data, no network. Pure Rust on top of serde /
# serde_json (already in the tree). MIT OR Apache-2.0,
# credited in About and THIRD-PARTY-NOTICES.md. All
# presence work runs on its own worker thread and every
# failure is silent: Discord being absent costs nothing.
discord-rich-presence = "1.1"

# Build tuning (OLD-SYSTEMS study §2.6): the previous
# profile set only opt-level = 2 — no LTO, 256 codegen
# units, symbols shipped in the exe. Fat LTO +
# codegen-units 1 cross-inline the hot paths (JSON
# parse, image decode, the search scan) on every
# machine; strip takes the symbol table out of the
# shipped exe (the deploy runbook archives an unstripped
# twin from the same build for crash reports).
# panic stays UNWIND on purpose: the app runs many
# worker threads (art, hunts, playback); with abort a
# panicking worker would kill the whole app.
# target-cpu stays unset: the tier-1 baseline (~2006,
# SSE3) is the public floor.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
